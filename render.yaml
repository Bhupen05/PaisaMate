services:
  - type: web
    name: paisamate-api
    runtime: python
    pythonVersion: 3.11
    buildCommand: cd server && pip install --upgrade pip setuptools wheel && pip install --no-build-isolation --prefer-binary -r requirements.txt
    startCommand: cd server && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DB_NAME
        value: suraty_prod
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://paisamate-nui6.onrender.com
    plan: starter
    
  - type: web
    name: paisamate-web
    runtime: node
    nodeVersion: 18
    buildCommand: cd apps/web && npm install && npm run build
    startCommand: cd apps/web && npm start
    rewrites: [{"source": "/(.*)", "destination": "/"}]
    envVars:
      - key: API_URL
        value: https://paisamate-nui6.onrender.com
    plan: starter
